<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATAS Market Research | Ultra Precision</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght=500;700&amp;family=Inter:wght=400;700&amp;display=swap" rel="stylesheet">
    <style>
        :root { --bg: #070B14; --hdr: #121822; --brd: #1F2937; --txt: #D1D5DB; --up: #10B981; --dn: #EF4444; --cyn: #00FFFF; --poc: #2962FF; }
        * { box-sizing: border-box; }
        body, html { margin: 0px; padding: 0px; width: 100vw; height: 100vh; background: var(--bg); color: var(--txt); font-family: Inter, sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        header { height: 38px; background: var(--hdr); border-bottom: 2px solid rgb(26, 33, 46); display: flex; align-items: center; justify-content: space-between; padding: 0px 12px; font-size: 11px; user-select: none; overflow: hidden; }
        .toolset { display: flex; align-items: center; gap: 15px; color: rgb(156, 163, 175); flex: 1 1 0%; min-width: 0px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .toolset::-webkit-scrollbar { display: none; }
        .toolset > div { flex-shrink: 0; display: flex; align-items: center; }
        .toolset b { color: rgb(255, 255, 255); margin-right: 4px; }
        .atas-input, .atas-select { background: rgb(31, 41, 55); border: 1px solid rgb(55, 65, 81); color: rgb(255, 255, 255); font-size: 11px; padding: 2px 6px; width: 90px; outline: none; font-weight: bold; text-transform: uppercase; }
        .atas-select { cursor: pointer; color: rgb(0, 255, 255); width: auto; font-size: 10px; padding: 1px 4px; border-color: rgb(75, 85, 99); }
        .price-badge-live { font-family: "Roboto Mono", monospace; font-weight: 700; font-size: 16px; padding-right: 40px; }
        main { flex: 1 1 0%; display: flex; position: relative; overflow: hidden; }
        #viewport { flex: 1 1 0%; position: relative; display: flex; flex-direction: column; cursor: crosshair; }
        #scale-right { width: 85px; background: rgb(10, 15, 23); border-left: 1px solid rgb(30, 41, 59); position: relative; cursor: ns-resize; }
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        #price-badge { position: absolute; right: 0px; background: var(--dn); color: rgb(255, 255, 255); font-family: "Roboto Mono", monospace; font-size: 11px; padding: 2px 6px; transform: translateY(-50%); width: 83px; text-align: right; z-index: 200; border-radius: 2px 0px 0px 2px; pointer-events: none; }
        .status-ohlc { position: absolute; top: 12px; left: 15px; font-family: "Roboto Mono", monospace; font-size: 10px; color: rgb(148, 163, 184); pointer-events: none; }
        #bottom-axis { height: 26px; background: rgb(9, 13, 20); border-top: 1px solid rgb(30, 41, 59); cursor: ew-resize; }
        #loader { position: absolute; inset: 0px; background: rgb(7, 11, 20); display: flex; align-items: center; justify-content: center; z-index: 1000; font-weight: bold; }
        #drawing-toolbar { position: absolute; left: 10px; top: 100px; display: flex; flex-direction: column; gap: 8px; z-index: 500; background: rgba(18, 24, 34, 0.8); padding: 8px; border-width: 1px 1px 1px 2px; border-style: solid; border-color: rgb(30, 41, 59) rgb(30, 41, 59) rgb(30, 41, 59) rgb(0, 255, 255); border-image: initial; border-radius: 4px; user-select: none; }
        .draw-btn { width: 32px; height: 32px; background: rgb(31, 41, 55); border: 1px solid rgb(55, 65, 81); color: rgb(255, 255, 255); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s; border-radius: 2px; }
        .draw-btn:hover, .draw-btn.active { background: rgb(0, 255, 255); color: rgb(0, 0, 0); border-color: rgb(0, 255, 255); box-shadow: rgba(0, 255, 255, 0.3) 0px 0px 10px; }
        #oi-resizer { height: 4px; background: rgb(30, 41, 59); cursor: ns-resize; flex-shrink: 0; z-index: 100; }
        #oi-panel-wrap { height: 120px; position: relative; background: rgb(6, 10, 18); flex-shrink: 0; overflow: hidden; }
        #oi-panel-wrap canvas { position: absolute; top: 0px; left: 0px; width: 100%; height: 100%; image-rendering: pixelated; }
        #stats-panel-wrap { height: 100px; position: relative; background: rgb(6, 10, 18); flex-shrink: 0; overflow: hidden; display: flex; border-top: 1px solid rgb(30, 41, 59); }
        #stats-panel-wrap canvas { position: absolute; top: 0px; left: 0px; width: 100%; height: 100%; image-rendering: pixelated; }
        #tf-heatmap-hud { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; background: rgba(12, 18, 28, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; z-index: 9999; user-select: none; transition: 0.3s; pointer-events: none; box-shadow: rgba(0, 0, 0, 0.5) 0px 4px 15px; }
        .tf-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 50px; height: 40px; background: rgba(31, 41, 55, 0.5); border-radius: 3px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .tf-label { font-size: 8px; font-weight: bold; color: rgb(148, 163, 184); margin-bottom: 2px; }
        .tf-status { font-size: 10px; font-weight: bold; font-family: "Roboto Mono", monospace; }
        #news-hud { position: absolute; top: 60px; right: 90px; display: none; flex-direction: column; gap: 8px; z-index: 900; pointer-events: none; width: 280px; }
        #bottom-nav { display: none; position: fixed; bottom: 0px; left: 0px; right: 0px; height: 56px; background: rgba(12, 18, 28, 0.97); backdrop-filter: blur(16px); border-top: 1px solid rgb(30, 41, 59); z-index: 2000; flex-direction: row; align-items: center; justify-content: space-around; padding: 0px 8px; }
        .bnav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: rgb(107, 114, 128); cursor: pointer; padding: 6px 16px; border-radius: 10px; transition: 0.2s; min-width: 60px; }
        .bnav-btn.active { color: rgb(0, 255, 255); background: rgba(0, 255, 255, 0.08); }
        .bnav-btn svg { width: 22px; height: 22px; stroke: currentcolor; fill: none; stroke-width: 2; }
        .bnav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
        #sheet-overlay { display: none; position: fixed; inset: 0px; background: rgba(0, 0, 0, 0.5); z-index: 2500; backdrop-filter: blur(4px); }
        #bottom-sheet { display: none; position: fixed; bottom: 0px; left: 0px; right: 0px; background: rgb(13, 20, 33); border-top: 1px solid rgb(30, 41, 59); border-radius: 20px 20px 0px 0px; z-index: 3000; padding: 0 0 env(safe-area-inset-bottom); transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
        #bottom-sheet.open { transform: translateY(0px); }
        .sheet-handle { width: 36px; height: 4px; background: rgb(55, 65, 81); border-radius: 2px; margin: 12px auto 0px; }
        .sheet-title { text-align: center; font-size: 13px; font-weight: 700; color: rgb(148, 163, 184); padding: 10px 0px 14px; border-bottom: 1px solid rgb(30, 41, 59); letter-spacing: 1px; text-transform: uppercase; }
        .sheet-content { padding: 14px 16px 20px; max-height: 60vh; overflow-y: auto; }
        .sheet-section-title { font-size: 10px; font-weight: 700; color: rgb(75, 85, 99); letter-spacing: 1.5px; text-transform: uppercase; margin: 14px 0px 8px; }
        .sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .sheet-toggle { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 6px; background: rgb(19, 28, 43); border: 1px solid rgb(30, 41, 59); border-radius: 10px; cursor: pointer; color: rgb(107, 114, 128); font-size: 10px; font-weight: 700; transition: 0.2s; letter-spacing: 0.5px; }
        .sheet-toggle.on { background: rgba(0, 255, 255, 0.08); border-color: rgb(0, 255, 255); color: rgb(0, 255, 255); }
        .sheet-toggle .st-icon { font-size: 18px; line-height: 1; }
        .sheet-tf-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .sheet-tf-btn { flex: 1 1 0%; min-width: 60px; padding: 10px 4px; background: rgb(19, 28, 43); border: 1px solid rgb(30, 41, 59); border-radius: 10px; color: rgb(148, 163, 184); font-size: 13px; font-weight: 700; text-align: center; cursor: pointer; transition: 0.2s; }
        .sheet-tf-btn.active { background: rgba(0, 255, 255, 0.1); border-color: rgb(0, 255, 255); color: rgb(0, 255, 255); }
        .sheet-sym-row { display: flex; gap: 8px; margin-top: 4px; }
        .sheet-sym-input { flex: 1 1 0%; background: rgb(19, 28, 43); border: 1px solid rgb(55, 65, 81); border-radius: 10px; color: rgb(255, 255, 255); font-size: 15px; font-weight: 700; padding: 11px 14px; text-transform: uppercase; outline: none; }
        .sheet-sym-go { background: rgb(0, 255, 255); color: rgb(0, 0, 0); font-weight: 700; font-size: 13px; border: none; border-radius: 10px; padding: 0px 20px; cursor: pointer; }
        @media (max-width: 767px) {
          #bottom-nav { display: flex; }
          body { padding-bottom: 56px; }
          body, html { overflow: hidden; }
          header { height: 48px; padding: 0px 12px; }
          header .toolset > div:not(:first-child):not(:last-child) { display: none; }
          header .toolset > div:last-child { display: none; }
          #oi-panel-wrap, #oi-resizer { display: none !important; }
          #scale-right { width: 60px; }
          .price-badge-live { font-size: 18px; }
          .atas-input { font-size: 13px; width: 110px; }
          #mobile-menu-btn { align-items: center; justify-content: center; width: 36px; height: 36px; background: rgb(31, 41, 55); border: 1px solid rgb(55, 65, 81); border-radius: 8px; color: rgb(255, 255, 255); font-size: 20px; cursor: pointer; margin-left: 6px; display: flex !important; }
          #bottom-sheet { display: block; }
          #sheet-overlay { display: block; }
        }
        @media (min-width: 768px) {
          #mobile-menu-btn { display: none !important; }
          #bottom-nav { display: none !important; }
        }
        .modal-overlay { position: fixed; inset: 0px; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 5000; }
        .modal-content { background: rgb(30, 34, 45); border-radius: 6px; width: 340px; box-shadow: rgba(0, 0, 0, 0.5) 0px 10px 40px; border: 1px solid rgb(54, 58, 69); color: rgb(209, 212, 220); font-family: Inter, sans-serif; overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgb(54, 58, 69); font-weight: 600; }
        .modal-close { cursor: pointer; font-size: 20px; color: rgb(120, 123, 134); }
        .modal-tabs { display: flex; border-bottom: 1px solid rgb(54, 58, 69); padding: 0px 16px; }
        .modal-tab { padding: 10px 0px; margin-right: 20px; font-size: 13px; font-weight: 600; color: rgb(120, 123, 134); cursor: pointer; position: relative; }
        .modal-tab.active { color: rgb(209, 212, 220); }
        .modal-tab.active::after { content: ""; position: absolute; bottom: 0px; left: 0px; right: 0px; height: 2px; background: rgb(41, 98, 255); }
        .modal-body { padding: 20px 16px; }
        .settings-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; font-size: 13px; }
        .settings-row label { color: rgb(209, 212, 220); }
        .settings-row input[type="number"], .settings-row select { background: rgb(42, 46, 57); border: 1px solid rgb(54, 58, 69); color: rgb(209, 212, 220); padding: 4px 8px; border-radius: 4px; outline: none; width: 120px; }
        .settings-row input[type="checkbox"] { accent-color: rgb(41, 98, 255); width: 16px; height: 16px; }
        .modal-footer { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-top: 1px solid rgb(54, 58, 69); }
        .template-select { background: rgb(42, 46, 57); border: 1px solid rgb(54, 58, 69); color: rgb(209, 212, 220); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .modal-btn { padding: 6px 16px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
        .modal-btn.cancel { background: rgb(54, 58, 69); color: rgb(209, 212, 220); }
        .modal-btn.ok { background: rgb(41, 98, 255); color: rgb(255, 255, 255); }
    </style>
</head>
<body>
    <header>
        <div class="toolset">
            <div style="display:flex; align-items:center;">
                <b>SYMBOL:</b>
                <input type="text" id="symbol-input" class="atas-input" value="BTCUSDT" spellcheck="false">
            </div>
            <div style="display:flex; align-items:center;">
                <b>TICK:</b>
                <input type="text" id="tick-input" class="atas-input" value="5.0" style="width:65px; margin-right:5px;">
                <button id="auto-tick-btn" class="draw-btn" style="width:24px; height:22px; font-size:10px; margin-right:5px;" title="Auto Tick">A</button>
                <select id="density-select" class="atas-select"><option value="">-- AGGREGATION --</option><option value="5">X1(5.0)</option><option value="10">X2(10.0)</option><option value="25">X5(25.0)</option><option value="50">X10(50.0)</option></select>
            </div>
            <div style="display:flex; align-items:center;">
                <b>PERIOD:</b>
                <select id="tf-select" class="atas-select" style="margin-right:15px;">
                    <option value="1m">1m</option>
                    <option value="5m">5m</option>
                    <option value="15m" selected>15m</option>
                    <option value="1h">1h</option>
                    <option value="2h">2h</option>
                    <option value="4h">4h</option>
                    <option value="1d">1d</option>
                </select>
            </div>
            <div style="display:flex; align-items:center; gap:5px;">
                <button id="imb-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px;" title="Diagonal Imbalance">IMB</button>
                <button id="stk-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px;" title="Stacked Imbalance">STK</button>
                <button id="heat-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px;" title="Liquidity Heatmap">HEAT</button>
                <button id="delta-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px;" title="Delta Histogram">DELTA</button>
                <button id="whale-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px;" title="Aggressive Whale Bubbles">WHALE</button>
                <button id="sizedelta-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px; color:#A78BFA; border-color:#A78BFA;" title="Trade Size Delta">SIZE-Δ</button>
                <button id="vpt-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px; color:#F59E0B; border-color:#F59E0B;" title="Volume Per Tick">VPT</button>
                <button id="domliq-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px; color:#00FFFF; border-color:#00FFFF;" title="Live DOM Liquidity">DOM-LIQ</button>
                <button id="domprof-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px; color:#10B981; border-color:#10B981;" title="Live Order Volume Profile">DOM-PROF</button>
                <button id="mms-btn" class="draw-btn" style="font-size:9px; width:auto; padding:0 6px; color:#A855F7; border-color:#A855F7;" title="Market Microstructure Score">MMS</button>
            </div>
        </div>
        <div id="hdr-p" class="price-badge-live">00.00</div>
        <button id="mobile-menu-btn" style="display:none;">☰</button>
    </header>

    <main>
        <div id="viewport">
            <iframe id="tv-frame" src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=BINANCE%3ABTCUSDT&interval=15&theme=dark&style=1" style="width: 100%; height: 100%; border: none; position: absolute; inset:0; z-index:1;"></iframe>
            <div class="status-ohlc" id="ohlc-info" style="z-index: 10;">Calibrating Engine UI Layout...</div>
            <div id="loader" style="display: none;">ULTRA PRECISION ENGINE...</div>
            <div id="bottom-axis" style="position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;"><canvas id="time-c"></canvas></div>
        </div>
        <div id="scale-right" style="z-index: 10;">
            <canvas id="scale-c"></canvas>
            <div id="price-badge">0.00</div>
        </div>
    </main>

    <script>
        // System Event Interactivity Sync
        const symbolInput = document.getElementById('symbol-input');
        const tfSelect = document.getElementById('tf-select');
        const iframe = document.getElementById('tv-frame');
        const ohlc = document.getElementById('ohlc-info');

        function updateSystemView() {
            const sym = symbolInput.value.toUpperCase().replace('/', '');
            let tf = tfSelect.value;
            if(tf === '1m') tf = '1';
            if(tf === '5m') tf = '5';
            if(tf === '15m') tf = '15';
            if(tf === '1h') tf = '60';
            if(tf === '2h') tf = '120';
            if(tf === '4h') tf = '240';
            if(tf === '1d') tf = 'D';

            ohlc.innerText = `Connecting: ${sym} (${tfSelect.value}) Engine Online`;
            iframe.src = `https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=BINANCE%3A${sym}&interval=${tf}&theme=dark&style=1`;
        }

        symbolInput.addEventListener('change', updateSystemView);
        tfSelect.addEventListener('change', updateSystemView);

        // Core App Button Interactions
        document.querySelectorAll('.draw-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
            });
        });
        
        // Initialize state
        setTimeout(() => { updateSystemView(); }, 500);
    </script>
</body>
</html>
