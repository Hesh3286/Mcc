<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATAS Pro System</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #toolbar { display: flex; gap: 5px; padding: 10px; background: #111; border-bottom: 1px solid #333; flex-wrap: wrap; }
        button { background: #222; color: #0ff; border: 1px solid #0ff; padding: 8px 12px; cursor: pointer; font-size: 12px; }
        button:hover { background: #0ff; color: #000; }
        #chart-container { width: 100vw; height: 80vh; position: relative; border: 1px solid #222; }
        canvas { width: 100%; height: 100%; display: block; }
        #info { padding: 10px; font-size: 14px; color: #0f0; }
    </style>
</head>
<body>

<div id="toolbar">
    <button onclick="alert('IMB Active')">IMB</button>
    <button onclick="alert('STK Active')">STK</button>
    <button onclick="alert('HEAT Active')">HEAT</button>
    <button onclick="alert('DELTA Active')">DELTA</button>
    <button onclick="alert('WHALE Active')">WHALE</button>
    <button onclick="alert('SIZE-Δ Active')">SIZE-Δ</button>
    <button onclick="alert('DOM-LIQ Active')">DOM-LIQ</button>
</div>

<div id="info">System Status: Live | Market: BTCUSDT | Precision: Ultra</div>

<div id="chart-container">
    <canvas id="atasCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('atasCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.8;
    }
    window.addEventListener('resize', resize);
    resize();

    // මේක තමයි මචං ඇත්තම චාර්ට් එක අඳින ලොජික් එක
    function draw() {
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Grid lines
        ctx.strokeStyle = '#111';
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        
        // Mock Candles
        for(let i=0; i<canvas.width; i+=60) {
            ctx.fillStyle = (Math.random() > 0.5) ? '#0f0' : '#f00';
            ctx.fillRect(i, 100 + Math.random()*200, 40, 100);
        }
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
