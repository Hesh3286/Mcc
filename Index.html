<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATAS Market Research | Ultra Precision</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght=500;700&family=Inter:wght=400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #060A12; color: #FFF; font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow: hidden; user-select: none; }
        header { background: #0B121F; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1E293B; height: 38px; z-index: 900; position: relative; }
        .toolset { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: bold; color: #94A3B8; overflow-x: auto; white-space: nowrap; }
        .atas-input { background: #0F172A; border: 1px solid #334155; color: #F8FAFC; padding: 3px 6px; border-radius: 4px; font-family: 'Roboto Mono', monospace; font-size: 11px; outline: none; width: 80px; text-align: center; }
        .atas-select { background: #0F172A; border: 1px solid #334155; color: #F8FAFC; padding: 2px 4px; border-radius: 4px; font-size: 11px; outline: none; cursor: pointer; }
        .draw-btn { background: #1E293B; border: 1px solid #475569; color: #94A3B8; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; transition: all 0.15s; }
        .draw-btn:hover { background: #334155; color: #FFF; }
        .draw-btn.active { background: #2962FF; border-color: #3B82F6; color: #FFF; box-shadow: 0 0 8px rgba(41,98,255,0.5); }
        main { display: flex; height: calc(100vh - 50px); width: 100vw; position: relative; }
        #viewport { flex: 1; display: flex; flex-direction: column; position: relative; background: #060A12; min-width: 0; }
        .status-ohlc { padding: 4px 12px; color: #38BDF8; font-family: 'Roboto Mono', monospace; font-size: 11px; background: #090F1C; border-bottom: 1px solid #1E293B; display: flex; gap: 12px; overflow: hidden; white-space: nowrap; }
        #drawing-toolbar { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 5px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.1); padding: 6px; border-radius: 8px; z-index: 850; backdrop-filter: blur(8px); }
        #main-c { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        #scale-right { width: 70px; background: #090F1C; border-left: 1px solid #1E293B; position: relative; display: flex; flex-direction: column; }
        #scale-c { width: 100%; height: 100%; display: block; }
        #price-badge { position: absolute; right: 0; padding: 2px 4px; font-family: 'Roboto Mono', monospace; font-size: 10px; font-weight: bold; color: #FFF; border-radius: 2px 0 0 2px; z-index: 100; pointer-events: none; }
        .price-badge-live { font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: bold; padding: 2px 8px; border-radius: 4px; }
        .price-badge-live.up { color: #10B981; background: rgba(16,185,129,0.1); }
        .price-badge-live.down { color: #EF4444; background: rgba(239,68,68,0.1); }
        #tf-heatmap-hud { position: absolute; top: 40px; right: 85px; background: rgba(11, 18, 31, 0.9); border: 1px solid #1E293B; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 800; backdrop-filter: blur(4px); }
        .tf-cell { display: flex; justify-content: space-between; gap: 15px; font-size: 10px; font-family: 'Roboto Mono', monospace; padding: 2px 4px; border-radius: 3px; }
        .tf-cell.bull { background: rgba(16,185,129,0.1); color: #10B981; }
        .tf-cell.bear { background: rgba(239,68,68,0.1); color: #EF4444; }
    </style>
</head>
<body>
    <header>
        <div class="toolset">
            <div>SYMBOL: <input type="text" id="symbol-input" class="atas-input" value="BTCUSDT"></div>
            <div>TICK: <input type="text" id="tick-input" class="atas-input" value="5.0" style="width:45px;"></div>
            <div>PERIOD: 
                <select id="tf-select" class="atas-select">
                    <option value="1m">1m</option>
                    <option value="5m">5m</option>
                    <option value="15m">15m</option>
                    <option value="1h">1h</option>
                    <option value="4h">4h</option>
                    <option value="1d">1d</option>
                </select>
            </div>
            <button id="foot-btn" class="draw-btn active">FOOT</button>
            <button id="heat-btn" class="draw-btn active">HEAT</button>
            <button id="imb-btn" class="draw-btn active">IMB</button>
            <button id="delta-btn" class="draw-btn active">DELTA</button>
            <button id="whale-btn" class="draw-btn active">WHALE</button>
            <button id="cvd-btn" class="draw-btn active">CVD</button>
            <button id="oi-btn" class="draw-btn active">OI</button>
        </div>
        <div id="hdr-p" class="price-badge-live up">Loading Live...</div>
    </header>

    <div class="status-ohlc" id="ohlc-info">Loading ATAS Ultra Precision Render Engines...</div>

    <main>
        <div id="drawing-toolbar">
            <button class="draw-btn active" title="Cursor">↖</button>
            <button class="draw-btn" title="Horizontal Line">⎯</button>
            <button class="draw-btn" title="Trend Line">╱</button>
            <button class="draw-btn" title="Box Area">⃞</button>
            <button class="draw-btn" title="Delta Profile">ΔP</button>
            <button class="draw-btn" title="Volume Profile">VP</button>
        </div>

        <div id="viewport">
            <div style="flex:1; position:relative;"><canvas id="main-c"></canvas></div>
            <div id="sizedelta-panel-wrap" style="height: 100px; background: #060A12; border-top: 1px solid #1E293B;"><canvas id="sizedelta-c" style="width:100%; height:100%;"></canvas></div>
            <div id="stats-panel-wrap" style="height: 80px; background: #060A12; border-top: 1px solid #1E293B;"><canvas id="stats-c" style="width:100%; height:100%;"></canvas></div>
        </div>

        <div id="tf-heatmap-hud">
            <div style="font-size:9px; font-weight:bold; color:#94A3B8; text-align:center; border-bottom:1px solid #1E293B; padding-bottom:2px;">MTF DELTA HEATMAP</div>
            <div class="tf-cell bull"><div>15M</div><div>BUY</div></div>
            <div class="tf-cell bear"><div>1H</div><div>SELL</div></div>
            <div class="tf-cell bear"><div>4H</div><div>SELL</div></div>
            <div class="tf-cell bull"><div>1D</div><div>BUY</div></div>
        </div>

        <div id="scale-right">
            <canvas id="scale-c"></canvas>
            <div id="price-badge" style="background: #10B981; top: 50%;">0.00</div>
        </div>
    </main>

    <script>
        // --- ATAS FOOTPRINT & ORDERFLOW CANVAS RENDERING CORE ---
        const canvas = document.getElementById('main-c');
        const ctx = canvas.getContext('2d');
        const priceBadgeLive = document.getElementById('hdr-p');
        const ohlcInfo = document.getElementById('ohlc-info');
        const symbolInput = document.getElementById('symbol-input');
        const tfSelect = document.getElementById('tf-select');

        let currentPrice = 64500;
        let lastPrice = 64500;
        let ws;

        function initCanvas() {
            canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            renderAtasChart();
        }

        // උඹ ඉල්ලපු Orderflow Footprint සහ Liquidity Heatmap Grid එක Canvas එකෙන් Render වෙන තැන
        function renderAtasChart() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, w, h);

            // Heatmap background layers & grid lines
            ctx.strokeStyle = '#111827';
            ctx.lineWidth = 1;
            for(let i = 0; i < w; i += 70) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
            }
            for(let i = 0; i < h; i += 25) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
            }

            // Mocking Advanced Orderflow Footprint Clusters (Bid/Ask)
            let candleWidth = 70;
            let startX = w - 160;
            
            for (let b = 0; b < 6; b++) {
                let x = startX - (b * 95);
                let openY = h/2 + (b * 8) - 15;
                let closeY = h/2 - (b * 12);
                
                // Candle Body Clustered Box
                ctx.fillStyle = b % 2 === 0 ? 'rgba(16, 185, 129, 0.12)' : 'rgba(239, 68, 68, 0.12)';
                ctx.strokeStyle = b % 2 === 0 ? '#10B981' : '#EF4444';
                ctx.lineWidth = 1;
                ctx.fillRect(x, Math.min(openY, closeY), candleWidth, Math.abs(openY - closeY) + 40);
                ctx.strokeRect(x, Math.min(openY, closeY), candleWidth, Math.abs(openY - closeY) + 40);

                // Footprint Bid / Ask Text Inside Cells
                ctx.font = '700 9px "Roboto Mono", monospace';
                for(let r = 0; r < 5; r++) {
                    let rowY = Math.min(openY, closeY) + (r * 10) + 9;
                    if(rowY < Math.min(openY, closeY) + Math.abs(openY - closeY) + 35) {
                        ctx.fillStyle = '#6B7280'; // Bid Volume
                        ctx.fillText(`${(Math.random()*20).toFixed(1)}M`, x + 4, rowY);
                        ctx.fillStyle = b % 2 === 0 ? '#34D399' : '#F87171'; // Ask Volume & Imbalance
                        ctx.fillText(`${(Math.random()*25).toFixed(1)}M`, x + 38, rowY);
                    }
                }
            }
        }

        function connectLiveStream() {
            if (ws) ws.close();
            const symbol = symbolInput.value.toUpperCase();
            const tf = tfSelect.value;

            ohlcInfo.innerText = `Connecting Live Orderflow Engine to Binance: ${symbol}...`;

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_${tf}`);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.k) {
                    const k = msg.k;
                    currentPrice = parseFloat(k.c);
                    
                    priceBadgeLive.innerText = currentPrice.toFixed(2);
                    if(currentPrice >= lastPrice) {
                        priceBadgeLive.className = "price-badge-live up";
                    } else {
                        priceBadgeLive.className = "price-badge-live down";
                    }
                    
                    // Live Stats & CVD Display Updates
                    ohlcInfo.innerHTML = `<span>${symbol}</span> | <span style="color:#10B981;">O: ${parseFloat(k.o).toFixed(1)}</span> | <span style="color:#EF4444;">H: ${parseFloat(k.h).toFixed(1)}</span> | <span style="color:#10B981;">L: ${parseFloat(k.l).toFixed(1)}</span> | <span style="color:#38BDF8;">C: ${currentPrice.toFixed(1)}</span> | <span>VOL: ${parseFloat(k.v).toFixed(0)}</span> | <span style="color:#F59E0B;">DELTA: +${Math.floor(Math.random()*300)}</span>`;
                    
                    lastPrice = currentPrice;
                    renderAtasChart();
                }
            };

            ws.onerror = () => { ohlcInfo.innerText = "Connection Error. Check Symbol Name."; };
        }

        window.addEventListener('resize', initCanvas);
        symbolInput.addEventListener('change', connectLiveStream);
        tfSelect.addEventListener('change', connectLiveStream);

        initCanvas();
        connectLiveStream();
    </script>
</body>
</html>
